name: Deploy to Netlify

on:
  push:
    branches: [main]
    paths:
      - "alpha-pwa/frontend/**"
      - "netlify.toml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: alpha-pwa/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: alpha-pwa/frontend

      - name: Build
        run: npm run build
        working-directory: alpha-pwa/frontend

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=alpha-pwa/frontend/dist --prod --site=${{ secrets.NETLIFY_SITE_ID }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
